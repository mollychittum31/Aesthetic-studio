<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aesthetic Keyboard</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; 
            font-family: sans-serif;
            transition: background-color 0.3s;
        }
        .box {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 440px;
        }
        .screen {
            background: #f5f6fa;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            min-height: 25px;
            margin-bottom: 15px;
            text-align: left;
            font-family: monospace;
            font-size: 16px;
        }
        .keyboard {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .row { margin-bottom: 4px; }
        .btn {
            background: #fff;
            border: none;
            border-bottom: 3px solid #b2bec3;
            border-radius: 4px;
            width: 34px;
            height: 34px;
            font-weight: bold;
            cursor: pointer;
            margin: 1px;
        }
        .btn:active {
            border-bottom: 0;
            background: #ff7675;
            color: #fff;
        }
        .spacebar { width: 150px; }
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .bubble {
            background: rgba(116, 185, 255, 0.2);
            border: 2px solid #74b9ff;
            border-radius: 50%;
            height: 35px;
            cursor: pointer;
        }
        .clear {
            background: #ff7675;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="margin:0 0 10px 0;color:#333;">ASMR Keyboard</h2>
        <div class="screen" id="display"></div>
        
        <div class="keyboard">
            <div class="row">
                <button class="btn" onclick="tap('Q', 110)">Q</button>
                <button class="btn" onclick="tap('W', 125)">W</button>
                <button class="btn" onclick="tap('E', 140)">E</button>
                <button class="btn" onclick="tap('R', 155)">R</button>
                <button class="btn" onclick="tap('T', 170)">T</button>
                <button class="btn" onclick="tap('Y', 185)">Y</button>
                <button class="btn" onclick="tap('U', 200)">U</button>
                <button class="btn" onclick="tap('I', 215)">I</button>
                <button class="btn" onclick="tap('O', 230)">O</button>
                <button class="btn" onclick="tap('P', 245)">P</button>
            </div>
            <div class="row">
                <button class="btn" onclick="tap('A', 130)">A</button>
                <button class="btn" onclick="tap('S', 145)">S</button>
                <button class="btn" onclick="tap('D', 160)">D</button>
                <button class="btn" onclick="tap('F', 175)">F</button>
                <button class="btn" onclick="tap('G', 190)">G</button>
                <button class="btn" onclick="tap('H', 205)">H</button>
                <button class="btn" onclick="tap('J', 220)">J</button>
                <button class="btn" onclick="tap('K', 235)">K</button>
                <button class="btn" onclick="tap('L', 250)">L</button>
            </div>
            <div class="row">
                <button class="btn" onclick="tap('Z', 150)">Z</button>
                <button class="btn" onclick="tap('X', 165)">X</button>
                <button class="btn" onclick="tap('C', 180)">C</button>
                <button class="btn" onclick="tap('V', 195)">V</button>
                <button class="btn" onclick="tap('B', 210)">B</button>
                <button class="btn" onclick="tap('N', 225)">N</button>
                <button class="btn" onclick="tap('M', 240)">M</button>
                <button class="btn spacebar" onclick="tap(' ', 100)"></button>
            </div>
        </div>

        <div class="bubble-grid">
            <button class="bubble" onclick="pop(600)"></button>
            <button class="bubble" onclick="pop(700)"></button>
            <button class="bubble" onclick="pop(800)"></button>
            <button class="bubble" onclick="pop(900)"></button>
        </div>

        <button class="clear" onclick="clr()">Clear</button>
    </div>

    <script>
        var bgColors = ["#fce4ec", "#e8f5e9", "#e0f7fa", "#fff3e0", "#f3e5f5"];
        var bgIndex = 0;
        var ctx = null;

        function noise(frequency, isPop) {
            try {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (isPop) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.02);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                    osc.start(); osc.stop(ctx.currentTime + 0.03);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(frequency * 2, ctx.currentTime + 0.01);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                    osc.start(); osc.stop(ctx.currentTime + 0.04);
                }
            } catch(e) {}
        }

        function shift() {
            bgIndex = (bgIndex + 1) % bgColors.length;
            document.body.style.backgroundColor = bgColors[bgIndex];
        }

        function tap(char, pitch) {
            document.getElementById("display").innerText += char;
            shift();
            noise(pitch, false);
        }

        function pop(pitch) {
            shift();
            noise(pitch, true);
        }

        function clr() {
            document.getElementById("display").innerText = "";
            shift();
            noise(120, false);
        }

        window.addEventListener('keydown', function(e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.key.length === 1) {
                var code = e.key.toUpperCase().charCodeAt(0);
                tap(e.key.toUpperCase(), 100 + (code % 20) * 8);
            } else if (e.key === "Backspace") {
                var str = document.getElementById("display").innerText;
                document.getElementById("display").innerText = str.slice(0, -1);
                shift();
                noise(90, false);
            }
        });
    </script>
</body>
</html>
